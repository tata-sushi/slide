<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comunicados — Tatá Sushi</title>
<link rel="icon" href="favicon.svg">
<!-- Fontes: DM Serif Display (marca) + DM Sans (texto) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
  /* ===== CONFIG DE MARCA (edite as cores aqui) ===== */
  :root{
    --verde:#4caf52;
    --fundo:#f4f4f2;
    --pagina-larg:1414px;   /* A4 em ~150dpi */
    --pagina-alt:2000px;
    --fonte-marca:'DM Serif Display', Georgia, 'Times New Roman', serif;
    --fonte-texto:'DM Sans', 'Segoe UI', Arial, sans-serif;
    --fundo-com:#f1faf3;    /* fundo do comunicado: verde bem claro, quase branco */
    --borda-com:#4caf52;    /* borda leve da folha, no verde da marca */
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#ddd;font-family:Arial,Helvetica,sans-serif;}
  /* moldura nos 4 lados (cantos completos da folha) */
  .pagina{width:var(--pagina-larg);min-height:var(--pagina-alt);background:var(--fundo-com);
    margin:20px auto;position:relative;overflow:hidden;border:15px solid var(--borda-com);padding:9px;}
  @media print{
    @page{size:A4 portrait;margin:0;}
    body{background:#fff;}
    /* o design é proporção A4 (1414x2000); escala para caber exatamente na folha */
    .pagina{zoom:0.5613;margin:0 !important;box-shadow:none !important;
      page-break-after:always;break-after:page;
      -webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .pagina:last-child{page-break-after:auto;break-after:auto;}
    .btn-imprimir{display:none !important;}
  }
  /* botão flutuante de imprimir / salvar PDF */
  .btn-imprimir{display:block;width:calc(100% - 40px);max-width:1414px;margin:20px auto 0;
    background:var(--verde);color:#fff;border:none;border-radius:14px;
    padding:26px;font-family:Arial,sans-serif;font-size:36px;font-weight:bold;
    cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.22);}
  .btn-imprimir:hover{background:#43a047;}

  /* =========================================================
     COMUNICADO (mesmo layout usado no Tatá News)
     ========================================================= */
  .comunicado{display:flex;flex-direction:column;}
  /* barra/cabeçalho com logo preto à esquerda */
  .comunicado .barra-topo{background:var(--verde);height:88px;display:flex;align-items:center;justify-content:center;position:relative;flex:0 0 auto;}
  .comunicado .barra-topo .titulo{font-family:var(--fonte-marca);font-size:58px;font-weight:normal;}
  .comunicado .barra-topo .titulo .verde{color:#0d3d12;}
  .comunicado .barra-topo .titulo .branco{color:#fff;}
  .comunicado .barra-topo .edicao{position:absolute;right:24px;bottom:8px;color:#fff;font-size:26px;font-family:var(--fonte-marca);}
  .comunicado .barra-topo .ico{position:absolute;left:28px;width:64px;height:64px;object-fit:contain;}
  /* corpo (fundo transparente = verde quase branco da folha) preenche o restante da página */
  .comunicado .corpo{background:transparent;flex:1;display:flex;flex-direction:column;justify-content:center;padding:80px 96px 60px;}
  .comunicado .corpo h1{font-family:var(--fonte-texto);font-size:112px;font-weight:800;color:var(--verde);
    text-align:center;letter-spacing:1px;line-height:1;margin:0 0 50px;}
  .comunicado .corpo .texto{font-family:var(--fonte-texto);font-size:41px;line-height:1.72;color:#223522;
    text-align:justify;}
  .comunicado .corpo .texto p{margin-bottom:34px;}
  .comunicado .corpo .texto p:last-child{margin-bottom:0;}
  .comunicado .corpo .texto .ola{font-weight:700;}
  .comunicado .corpo .texto .final{text-align:center;font-weight:700;font-size:44px;color:var(--verde);margin:16px 0 0;}
  /* ---- Comunicado de Wi-Fi ---- */
  .comunicado .wifi{display:flex;flex-direction:column;align-items:center;}
  .comunicado .wifi .icone{width:210px;color:var(--verde);}
  .comunicado .wifi .icone svg{width:100%;height:auto;display:block;}
  .comunicado .wifi h1{margin:14px 0 44px;}
  .comunicado .wifi .campos{display:flex;flex-direction:column;gap:40px;width:100%;max-width:760px;}
  .comunicado .wifi .campo{text-align:center;}
  .comunicado .wifi .rotulo{font-family:var(--fonte-texto);font-size:38px;font-weight:700;letter-spacing:6px;
    text-transform:uppercase;color:#2a7d33;margin-bottom:16px;}
  .comunicado .wifi .valor{font-family:var(--fonte-texto);font-size:52px;font-weight:800;color:#fff;
    background:var(--verde);border-radius:16px;padding:24px 20px;letter-spacing:1px;word-break:break-word;}
  /* rodapé verde com redes sociais */
  .comunicado .rodape{background:var(--verde);color:#fff;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:26px 64px;padding:40px 60px;}
  .comunicado .rodape .rede{display:flex;align-items:center;gap:15px;font-family:var(--fonte-texto);font-size:30px;line-height:1;}
  .comunicado .rodape .rede svg{width:42px;height:42px;fill:#fff;flex:0 0 auto;}
</style>
</head>
<body>
<!-- Botão flutuante: imprimir / salvar em PDF -->
<button type="button" class="btn-imprimir" onclick="window.print()" title="Imprimir ou salvar em PDF">🖨️ Imprimir / PDF</button>

<!-- ============================================================
     COMUNICADO
     COMO CRIAR OUTRO: copie todo o bloco <div class="pagina comunicado"> ... </div>
     e cole logo abaixo. Cada bloco vira uma página A4 no PDF.
     ============================================================ -->
<!-- COMUNICADO 1 — Wi-Fi -->
<div class="pagina comunicado">
  <div class="corpo">
    <div class="wifi">
      <div class="icone">
        <svg viewBox="0 0 100 78" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" aria-label="Wi-Fi">
          <path d="M8 26 A62 62 0 0 1 92 26"/>
          <path d="M23 43 A41 41 0 0 1 77 43"/>
          <path d="M37 58 A23 23 0 0 1 63 58"/>
          <circle cx="50" cy="70" r="5.5" fill="currentColor" stroke="none"/>
        </svg>
      </div>
      <h1>WI-FI</h1>
      <div class="campos">
        <div class="campo">
          <div class="rotulo">Rede</div>
          <div class="valor">TATA HOUSE</div>
        </div>
        <div class="campo">
          <div class="rotulo">Senha</div>
          <div class="valor">#Tatahouse1234</div>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
